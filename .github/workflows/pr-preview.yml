# Automatic backend previews for pull requests in THIS repo (your fork).
#
#   PR opened / new commit  ->  GitHub builds the image
#                           ->  your laptop (self-hosted runner) deploys it
#                           ->  a comment with the preview link appears on the PR
#   PR closed / merged      ->  your laptop deletes the preview
#
# Needs: a self-hosted runner on the laptop that runs the cluster, with kubectl
# working there. Optional repo variable PREVIEW_PLATFORM = linux/arm64 on an
# Apple Silicon Mac (default linux/amd64).
name: PR preview

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]

# A newer commit cancels the older run for the same PR.
concurrency:
  group: pr-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write
  pull-requests: write

jobs:
  build:
    # Only PRs made inside this repo. The deploy runs on your own laptop, so
    # never run it for PRs from other people's forks.
    if: github.event.action != 'closed' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 40
    outputs:
      image: ${{ steps.names.outputs.image }}
      sha: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Work out the image name
        id: names
        env:
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha }}
          OWNER: ${{ github.repository_owner }}
        run: |
          owner_lc="$(printf '%s' "$OWNER" | tr '[:upper:]' '[:lower:]')"
          echo "image=ghcr.io/${owner_lc}/ziki-previews:pr-${PR}-${SHA:0:12}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ vars.PREVIEW_PLATFORM || 'linux/amd64' }}
          push: true
          tags: ${{ steps.names.outputs.image }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: self-hosted
    timeout-minutes: 20
    # On a Windows laptop this uses Git Bash, so the same scripts work everywhere.
    defaults:
      run:
        shell: bash
    steps:
      # The scripts come from your main branch, never from the PR, so a PR
      # can't change what runs on your laptop. Only the previews/ folder is
      # fetched, to save disk space.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: previews
          persist-credentials: false

      # Git on Windows can turn line endings into CRLF, which breaks bash scripts.
      - name: Fix line endings
        run: sed -i 's/\r$//' previews/scripts/*.sh previews/k8s/*.yaml

      - name: Deploy the preview
        id: deploy
        env:
          PREVIEW_TUNNEL: "1"
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ needs.build.outputs.sha }}
          IMAGE: ${{ needs.build.outputs.image }}
        run: bash previews/scripts/deploy-preview.sh "$REPO" "$PR" "$SHA" "$IMAGE"

      - name: Comment the link on the PR
        uses: actions/github-script@v7
        env:
          URL: ${{ steps.deploy.outputs.url }}
          NS: ${{ steps.deploy.outputs.namespace }}
          SHA: ${{ needs.build.outputs.sha }}
          IMAGE: ${{ needs.build.outputs.image }}
          ADMIN_EMAIL: ${{ steps.deploy.outputs.admin_email }}
          ADMIN_PASSWORD: ${{ steps.deploy.outputs.admin_password }}
        with:
          script: |
            const marker = '<!-- ziki-preview -->';
            const e = process.env;
            const { owner, repo } = context.repo;
            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            const commitUrl = `${context.serverUrl}/${owner}/${repo}/commit/${e.SHA}`;
            const body = [
              marker,
              '### Preview ready',
              '',
              `**${e.URL}**`,
              '',
              '| Sign in | |',
              '| --- | --- |',
              `| Email | \`${e.ADMIN_EMAIL}\` |`,
              `| Password | \`${e.ADMIN_PASSWORD}\` |`,
              '',
              'Throwaway login for this preview only. Its database is deleted when the PR closes.',
              'The first load after a pause can take a minute while the app starts.',
              '',
              '<details><summary>How this preview was made</summary>',
              '',
              `1. This PR got commit [\`${e.SHA.slice(0, 7)}\`](${commitUrl}).`,
              `2. GitHub Actions built its Docker image: \`${e.IMAGE}\` ([run](${runUrl})).`,
              `3. The self-hosted runner deployed it to Kubernetes namespace \`${e.NS}\`: the app, its own empty Postgres, and a tunnel for the public link.`,
              '4. The app ran its database migrations on start, then a preview login was created.',
              '5. This comment was posted. New commits update it; closing the PR deletes everything.',
              '',
              '</details>',
            ].join('\n');
            const issue_number = context.payload.pull_request.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const mine = comments.find(c => c.body && c.body.includes(marker));
            if (mine) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: mine.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

  cleanup:
    if: github.event.action == 'closed' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: self-hosted
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: previews
          persist-credentials: false

      - name: Fix line endings
        run: sed -i 's/\r$//' previews/scripts/*.sh previews/k8s/*.yaml

      - name: Delete the preview
        env:
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: bash previews/scripts/destroy-preview.sh "$REPO" "$PR"

      - name: Update the PR comment
        uses: actions/github-script@v7
        with:
          script: |
            const marker = '<!-- ziki-preview -->';
            const body = `${marker}\n### Preview deleted\n\nThis PR was closed, so its preview and database were removed.`;
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const mine = comments.find(c => c.body && c.body.includes(marker));
            if (mine) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: mine.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
